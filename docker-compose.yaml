# Standalone docker-compose for youtube_upload_service development.
# For full ecosystem, use the central w2v/docker-compose.yml instead.
#
# Usage:
#   docker compose up -d          # start service + infra
#   docker compose up -d --build  # rebuild and start

services:
  postgres:
    image: postgres:18-alpine
    container_name: youtube_upload_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: youtube_upload_service
    ports:
      - "5455:5432"
    volumes:
      - youtube_upload_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: youtube_upload_redis
    command: redis-server --appendonly yes
    ports:
      - "6395:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  youtube-upload-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: youtube_upload_service
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/youtube_upload_service
      REDIS_URL: redis://redis:6379/0
      API_HOST: 0.0.0.0
    ports:
      - "6315:6315"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6315/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  youtube_upload_postgres_data:
